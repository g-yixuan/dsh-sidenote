packages:
  - .

# dsh 系包的 peer 链（dsh-tools 等）在 autoInstallPeers 下会把半个宿主
# 依赖树拉进开发树并触发上游悬空范围（>=0.1.5 <0.2.0-0）解析失败——
# 插件的 dsh-* 依赖只为类型面（import type），运行时由宿主 bundle 提供，
# 不自动装 peer（better-sidebar 同款纪律）。
autoInstallPeers: false

# pnpm 的 strict-dep-builds 护栏放行：node-pty 来自 dsh-better-sidebar（peer，
# 开发环境会装）；CI（pnpm 11）默认拦截其构建脚本。
allowBuilds:
  node-pty: true

# vitest 是成熟工具链、发版频繁；其 patch 版本常被 <24h 的 minimumReleaseAge
# 护栏拦截（CI 用 pnpm 11 时）。排除放行。
minimumReleaseAgeExclude:
  - vitest
  - '@vitest/*'
  # jsdom 测试链传递依赖（tough-cookie / dom-selector 之下），不发版进产物——
  # 与 vitest 同款豁免逻辑（2026-09-07 CI 连红实证：三者发布不足 24h 被拦）。
  - tldts
  - tldts-core
  - bidi-js
