name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 宿主版本 canary：每周一跑 latest 组合（发现「宿主新版悄悄发布」的触发机制，
  # 对抗矩阵滞后——arch-adversarial B1-3）。
  schedule:
    - cron: '0 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Arch gates (分层/边界/预算)
        run: pnpm check:arch
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  # Pack the plugin as an npm tarball, mount it into a REAL DSH instance
  # through the official `dsh plugin --profile web add` channel and drive the
  # native DSH web UI headlessly
  # (Playwright Chromium) through the journey lanes. No API key needed — the
  # seeded session jsonl makes the fork path work keyless.
  plugin-mount:
    name: plugin-mount (${{ matrix.dsh-version }}, ${{ matrix.bs-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rolling support window: only the two admitted native hosts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh-version: '0.2.0-rc.2'
            bs-version: 'none'
          - dsh-version: '0.2.1-rc.2'
            bs-version: 'none'
    env:
      DSH_TELEMETRY_DISABLED: '1'
      BS_VERSION: ${{ matrix.bs-version }}
      DSH_EXPECTED_VERSION: ${{ matrix.dsh-version }}
      DSH_E2E_CAPABILITY_FAULT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh-version }}

      - name: Build and pack the npm tarball
        run: pnpm build && pnpm pack

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Mount and run host journeys
        run: pnpm test:mount

      - name: Reject incompatible updates and retain the pinned legacy release
        run: pnpm test:compat

      - name: Upload host inventory and journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dsh-${{ matrix.dsh-version }}-bs-${{ matrix.bs-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Resolve latest once; failures signal a candidate admission, never expand support.
  host-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve latest once
        id: host
        run: |
          version=$(npm view @deepseek-ai/dsh dist-tags.latest)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Canary host: $version"
      - name: Install resolved dsh CLI
        env:
          DSH_CANDIDATE: ${{ steps.host.outputs.version }}
        run: npm install -g "@deepseek-ai/dsh@$DSH_CANDIDATE"
      - name: Build and pack the npm tarball
        run: pnpm build && pnpm pack
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Canary host journeys
        env:
          BS_VERSION: none
          DSH_EXPECTED_VERSION: ${{ steps.host.outputs.version }}
          DSH_E2E_CAPABILITY_FAULT: '1'
        run: pnpm test:mount
      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-canary-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
