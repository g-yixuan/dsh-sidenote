name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Pack the plugin as an npm tarball, mount it into a REAL DSH instance
  # through the official `dsh plugin --profile web add` channel (together with
  # dsh-better-sidebar from npm), and drive the DSH web UI headlessly
  # (Playwright Chromium) through the journey lanes. No API key needed — the
  # seeded session jsonl makes the fork path work keyless.
  plugin-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 双版本矩阵：声明支持的最低版 + 当前最新版（peer 放宽后必须持续验证两端）。
    strategy:
      fail-fast: false
      matrix:
        bs-version: ['0.12.3', '0.16.1']
    env:
      DSH_TELEMETRY_DISABLED: '1'
      BS_VERSION: ${{ matrix.bs-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Build and pack the npm tarball
        run: pnpm build && pnpm pack

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Mount + headless-render smoke
        run: pnpm test:mount

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bs-${{ matrix.bs-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
