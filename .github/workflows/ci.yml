name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host-canary:
        description: Probe all published hosts in the supported series
        type: boolean
        default: false
  # Daily discovery; Monday and manual canaries cover every published in-window host.
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      host-matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate series ranges and resolve the boundary host matrix
        id: hosts
        run: |
          matrix=$(node scripts/host-window.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Arch gates (分层/边界/预算)
        run: pnpm check:arch
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  # Pack the plugin as an npm tarball, mount it into a REAL DSH instance
  # through the official `dsh plugin --profile web add` channel and drive the
  # native DSH web UI headlessly
  # (Playwright Chromium) through the journey lanes. No API key needed — the
  # seeded session jsonl makes the fork path work keyless.
  plugin-mount:
    needs: ci
    name: plugin-mount (${{ matrix.dsh-version }}, ${{ matrix.bs-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Minimum and latest verified host of the current series, deduplicated.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci.outputs.host-matrix) }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      BS_VERSION: ${{ matrix.bs-version }}
      DSH_EXPECTED_VERSION: ${{ matrix.dsh-version }}
      DSH_E2E_CAPABILITY_FAULT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh-version }}

      - name: Build and pack the npm tarball
        run: pnpm build && pnpm pack

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Mount and run host journeys
        run: pnpm test:mount

      - name: Reject incompatible updates and retain the current compatible build
        run: pnpm test:compat

      - name: Upload host inventory and journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dsh-${{ matrix.dsh-version }}-bs-${{ matrix.bs-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  host-compatibility:
    if: always()
    needs: [ci, plugin-mount]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require CI and every boundary host to succeed
        env:
          CI_RESULT: ${{ needs.ci.result }}
          HOST_RESULT: ${{ needs.plugin-mount.result }}
        run: test "$CI_RESULT" = success && test "$HOST_RESULT" = success

  host-discovery:
    if: github.event_name == 'schedule' || inputs.host-canary == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve published hosts once and select regression targets
        id: hosts
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p test-results
          npm view @deepseek-ai/dsh versions dist-tags --json > test-results/host-registry.json
          args=()
          if [ "$MANUAL" = true ] || [ "$(date -u +%u)" = 1 ]; then args+=(--all); fi
          node scripts/host-window.mjs --discover test-results/host-registry.json "${args[@]}" > test-results/host-candidates.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync('test-results/host-candidates.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify(plan.matrix) + '\n')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(plan, null, 2) + '\n```\n')
          JS
      - name: Report channels that require a new series admission
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync('test-results/host-candidates.json', 'utf8'))
          const outside = plan.channels.filter(channel => !channel.eligible)
          if (outside.length) throw new Error('Host series admission required: ' + outside.map(x => x.channel + '=' + x.version).join(', '))
          JS
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-discovery
          path: test-results/host-*.json
          if-no-files-found: ignore

  host-canary:
    needs: host-discovery
    # Still exercise in-window hosts when a channel points outside the window.
    if: always() && needs.host-discovery.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-discovery.outputs.matrix) }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      BS_VERSION: none
      DSH_EXPECTED_VERSION: ${{ matrix.dsh-version }}
      DSH_E2E_CAPABILITY_FAULT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install exact candidate CLI
        run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh-version }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Full host journeys (build and pack through pretest)
        run: pnpm test:mount
      - name: Installer compatibility and rollback
        run: pnpm test:compat
      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-canary-evidence-${{ matrix.dsh-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
